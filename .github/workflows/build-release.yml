name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@eugen-eugen'
      
      - name: Install dependencies
        run: npm install --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build bundled script
        run: npm run build
      
      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            jemojemo/archi-scripts:${{ steps.version.outputs.version }}
            jemojemo/archi-scripts:latest
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
      
      - name: Deploy to release branch
        run: |
          # Save the bundled artifacts outside the work tree
          mkdir -p /tmp/release
          cp dist/comatrix-bundled.ajs dist/metacomatrix-bundled.ajs /tmp/release/
          
          # Configure git to use the GitHub token
          git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"
          
          # Check out the release branch: reset to remote if it exists, else create it orphan
          if git ls-remote --exit-code --heads origin release >/dev/null 2>&1; then
            git fetch origin release
            git checkout -B release origin/release
          else
            git checkout --orphan release
          fi
          
          # Remove all tracked files (keep .git)
          git rm -rf . >/dev/null 2>&1 || true
          
          # Copy the bundled files
          cp /tmp/release/comatrix-bundled.ajs /tmp/release/metacomatrix-bundled.ajs .
          
          # Add and commit
          git add comatrix-bundled.ajs metacomatrix-bundled.ajs
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Release: Update bundled scripts from ${{ github.sha }}"
            git push origin release
          fi
